# Copy this file to config.toml and edit it for your site.
# config.toml is git-ignored, so your location never gets committed.

site_name  = "My Backyard"
latitude   = 51.4779      # decimal degrees, north positive
longitude  = -0.0015      # decimal degrees, east positive
timezone   = "Europe/London"   # IANA name, e.g. Europe/Amsterdam, America/New_York

# Sun this many degrees below the horizon counts as "dark" (12 = nautical night,
# 18 = astronomical night — but at high latitudes 18 never happens in summer).
dark_depression = 12.0

# A target must reach at least this altitude (degrees) to count as "usable".
min_altitude = 30.0

# Time resolution of the calculation, minutes (smaller = slower, more precise).
step_minutes = 15

# Field of view (degrees) for the framing previews. Roughly:
#   width  = 57.3 * sensor_width_mm  / focal_length_mm
#   height = 57.3 * sensor_height_mm / focal_length_mm
fov_width_deg = 2.0
fov_height_deg = 1.33

# ---- Weather verdict — the same method and defaults as SkyGuard ----
# Two Open-Meteo models: a high-resolution primary and a cross-check. A night is 🟢
# only when both agree. KNMI HARMONIE covers the Netherlands and surroundings for
# ~2.5 days; elsewhere (or further out) nights fall back to the secondary alone, 🟡 at best.
primary_model   = "knmi_harmonie_arome_netherlands"
secondary_model = "ecmwf_ifs025"
low_cloud_max   = 20            # % — an hour is usable only with low cloud at or below this…
mid_cloud_max   = 50            # % — …and mid cloud at or below this (high cloud doesn't gate)
high_cloud_confident_max = 60   # % — heavier high cloud drops a night from 🟢 to 🟡
high_cloud_note = 40            # % — average high cloud above this gets a note
exposure_start_hour = 18        # gear is outside (must stay dry) from this hour…
exposure_end_hour   = 9         # …until this hour next morning
precip_amount_max = 0.0         # mm — any forecast rain above this in that window is a no-go
precip_prob_max   = 0           # % — any rain chance above this is a no-go
wind_sustained_warn_kmh = 25
wind_gust_warn_kmh      = 40
wind_gust_veto_kmh      = 55    # gusts above this are a no-go
min_usable_hours   = 2
min_continuous_run = 2
confident_min_run  = 2
