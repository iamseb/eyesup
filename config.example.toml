# Copy this file to config.toml and edit it for your site.
# config.toml is git-ignored, so your location never gets committed.

site_name  = "My Backyard"
latitude   = 51.4779      # decimal degrees, north positive
longitude  = -0.0015      # decimal degrees, east positive
timezone   = "Europe/London"   # IANA name, e.g. Europe/Amsterdam, America/New_York

# Sun this many degrees below the horizon counts as "dark" — the imaging window
# (18 = astronomical night, 12 = nautical; at ~52°N, 18 never happens mid-May to late July).
dark_depression = 18.0

# A target must reach at least this altitude (degrees) to count as "usable".
min_altitude = 30.0

# Time resolution of the calculation, minutes (smaller = slower, more precise).
step_minutes = 15

# Field of view (degrees) for the framing previews. Roughly:
#   width  = 57.3 * sensor_width_mm  / focal_length_mm
#   height = 57.3 * sensor_height_mm / focal_length_mm
fov_width_deg = 2.0
fov_height_deg = 1.33

# ---- Weather verdict — the same method and defaults as SkyGuard ----
# Two Open-Meteo models: a high-resolution primary and a cross-check. A night is 🟢
# only when both agree. KNMI HARMONIE covers the Netherlands and surroundings for
# ~2.5 days; elsewhere (or further out) nights fall back to the secondary alone, 🟡 at best.
primary_model   = "knmi_harmonie_arome_netherlands"
secondary_model = "ecmwf_ifs025"
low_cloud_max   = 20            # % — an hour is usable only with low cloud at or below this…
mid_cloud_max   = 50            # % — …and mid cloud at or below this (high cloud doesn't gate)
high_cloud_confident_max = 60   # % — heavier high cloud drops a night from 🟢 to 🟡
high_cloud_note = 40            # % — average high cloud above this gets a note
exposure_start_hour = 22        # telescope is out (must stay dry) from this hour — rain earlier just means setting up later…
exposure_end_hour   = 7         # …until you're up next morning
exposure_end_hour_by_evening = { fri = 9, sat = 9 }   # later mornings, by the evening's weekday
precip_amount_max = 0.0         # mm — any forecast rain above this in that window is a no-go
precip_prob_max   = 0           # % — any rain chance above this is a no-go
wind_sustained_warn_kmh = 25
wind_gust_warn_kmh      = 40
wind_gust_veto_kmh      = 55    # gusts above this are a no-go
min_usable_hours   = 2
min_continuous_run = 2
confident_min_run  = 2
# Mist, fog and haze — cloud cover misses water droplets near the ground. KNMI
# HARMONIE forecasts visibility (ECMWF doesn't; the dew-point spread stands in).
fog_visibility_m  = 1000        # m — fog in either model makes an hour unusable
mist_visibility_m = 20000       # m — mist keeps an hour usable but drops the night to 🟡
mist_spread_c     = 1.5         # °C — air this close to its dew point counts as mist when no model gives visibility
aod_haze_max      = 0.3         # aerosol optical depth (CAMS) — dust or smoke above this is hazy, like mist
dew_spread_c      = 2.0         # °C — reported: dew (or frost) likely, fit the heaters
jet_seeing_kmh    = 150         # km/h at 250 hPa — reported: fast jet stream, poor seeing
# Worth setting up? Each usable hour is weighted by how much data it gives through each
# filter (Hα/SII, OIII) next to a clean, moonless hour — mist, haze and moonlight cost
# time — to give the night's "equivalent clear hours". Below this in every filter, a
# clear night is a no-go: not worth setting up. The rest are rough physical assumptions.
worth_it_hours     = 2.0
mist_depth_km      = 0.5        # assumed depth of the misty layer (forecasts don't say)
target_airmass     = 1.5        # a typical target, ~40° up
clear_visibility_m = 50000      # the clearest air the forecast reports
mist_standin_vis_m = 10000      # assumed visibility when only the dew-point spread says mist
aod_clean          = 0.1        # clean-air aerosol optical depth, the baseline
